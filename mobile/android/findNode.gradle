/**
 * Resolve a Node.js binary Android Studio's Gradle daemon can actually run.
 * Prefer android/bin/node (wrapper). Override with NODE_BINARY or
 * android/local.properties → node.binary=
 */

def androidRootForFindNode() {
  def candidates = []
  try { candidates << settingsDir } catch (Throwable ignored) {}
  try { candidates << rootDir } catch (Throwable ignored) {}
  try { candidates << projectDir } catch (Throwable ignored) {}
  for (d in candidates) {
    if (d == null) continue
    def dir = d instanceof File ? d : file(d.toString())
    if (new File(dir, "settings.gradle").exists()) return dir
    def parent = dir.parentFile
    if (parent != null && new File(parent, "settings.gradle").exists()) return parent
  }
  return file(".")
}

apply from: new File(androidRootForFindNode(), "ensureNodePath.gradle")

def executableNode(String path) {
  if (path == null || path.trim().isEmpty()) return null
  def f = new File(path.trim())
  return f.exists() ? f.absolutePath : null
}

def resolveNodeBinary() {
  def fromEnv = executableNode(System.getenv("NODE_BINARY"))
  if (fromEnv != null) return fromEnv

  def wrapperFile = new File(androidRootForFindNode(), "bin/node")
  if (wrapperFile.exists()) {
    def proc = ["/bin/bash", wrapperFile.absolutePath, "--print-path"].execute()
    proc.waitFor()
    def printed = proc.text.trim()
    if (proc.exitValue() == 0 && printed) return printed
    return wrapperFile.absolutePath
  }

  throw new GradleException(
    """Could not find Node.js.

Install Node 22 from https://nodejs.org then in a terminal:

  cd ${androidRootForFindNode().parentFile.absolutePath}
  bash ./scripts/setup-android-studio.sh

Then File → Sync Project with Gradle Files.
"""
  )
}

ext.NODE_BINARY = resolveNodeBinary()

def mobileRoot = androidRootForFindNode().parentFile
def reactNativePkg = new File(mobileRoot, "node_modules/react-native/package.json")
if (!reactNativePkg.exists()) {
  throw new GradleException(
    """Node wrapper is present but mobile/node_modules is missing.

In a terminal:

  cd ${mobileRoot.absolutePath}
  bash ./scripts/setup-android-studio.sh

Then File → Sync Project with Gradle Files in Android Studio.
"""
  )
}

gradle.ext.nodeBinary = ext.NODE_BINARY
logger.lifecycle("Using Node.js via ${ext.NODE_BINARY}")
