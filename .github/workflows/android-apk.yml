name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: node ./scripts/patch-expo-node.js
      - run: bash ./scripts/build-apk.sh
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://budgeting-app-m3aj.onrender.com
      - name: Name the APK for download
        run: |
          mkdir -p /tmp/setaside-apk
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/setaside-apk/Setaside.apk
          ls -lh /tmp/setaside-apk/Setaside.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Setaside-android-apk
          path: /tmp/setaside-apk/Setaside.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable GitHub Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: setaside-android-latest
          name: Setaside Android APK
          body: |
            Sideloadable Setaside expense logger for Android.

            1. Download **Setaside.apk** below
            2. Copy it to your phone
            3. Open the file and install (allow “Install unknown apps” if asked)
            4. Sign in with the same account as the website

            Built against `https://budgeting-app-m3aj.onrender.com`
          files: /tmp/setaside-apk/Setaside.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
