services:
  - type: web
    name: budgeting-app-api
    runtime: python
    rootDir: api
    # Keep build DB-free; run migrations on start so a Neon blip doesn't fail the build.
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.migrate && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.3"
